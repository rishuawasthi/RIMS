name: RIMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------------------------------------------------------------
  # 1. BACKEND: LINT, TEST & PACKAGE
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Unit Tests & Verify Build
        run: ./mvnw clean verify -B

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: auth-backend/target/surefire-reports/

  # ---------------------------------------------------------------------------
  # 2. FRONTEND: LINT, TEST & PRODUCTION BUNDLE
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Node 22 / Angular 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-auth

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: angular-auth/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Build Production Bundle
        run: npm run build

      - name: Archive Production Dist
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-bundle
          path: angular-auth/dist/frontend

  # ---------------------------------------------------------------------------
  # 3. CONTAINERIZATION: DOCKER BUILD & SECURITY SCAN
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Containerization
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./auth-backend
          push: false
          tags: xyzretail/rims-backend:${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./angular-auth
          push: false
          tags: xyzretail/rims-frontend:${{ github.sha }}
