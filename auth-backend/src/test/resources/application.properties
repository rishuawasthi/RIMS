spring.application.name=auth-backend-test
server.port=8080

spring.datasource.url=jdbc:h2:mem:rimstest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

rims.jwt.secret=RimsTestSecretKeyForTestingPurposesMustBeAtLeast256BitsLong!
rims.jwt.expiration-ms=86400000

spring.jpa.open-in-view=false
