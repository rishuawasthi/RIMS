spring.application.name=auth-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hcl}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# JWT configuration
# IMPORTANT: Override this secret in production via environment variable RIMS_JWT_SECRET
rims.jwt.secret=${RIMS_JWT_SECRET:RimsDefaultDevSecretKeyAtLeast256BitsLongForLocalDevOnly!}
rims.jwt.expiration-ms=${RIMS_JWT_EXPIRATION_MS:86400000}

# JPA: open-in-view=false to avoid implicit transactions in controller layer
spring.jpa.open-in-view=false

# Springdoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
